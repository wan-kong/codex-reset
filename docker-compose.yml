services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-reset:latest
    container_name: codex-reset
    network_mode: host
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Keep the SQLite file inside the mounted data volume.
      DATABASE_URL: "file:data/codex-reset-record.sqlite"
      LOG_DIR: "logs"
      NODE_OPTIONS: --use-env-proxy
      PORT: 3102
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      ALL_PROXY: http://127.0.0.1:7890
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3102/zh').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# The reset check runs via POST /api/jobs/check-usage guarded by CRON_SECRET.
# Trigger it from an external scheduler (host cron / GitHub Actions / Uptime
# pinger), e.g.:
#   curl -fsS -X POST http://localhost:3000/api/jobs/check-usage \
#     -H "x-cron-secret: $CRON_SECRET"

volumes:
  codex-data:
  codex-logs:
